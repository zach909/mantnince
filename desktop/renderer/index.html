<!doctype html><html><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universal Backup Cloud</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><span class="eyebrow">Desktop companion</span><h1>Universal Backup Cloud</h1></div><span id="mode" class="badge">Loading</span></header><section class="settings"><label>API endpoint<input id="api" type="url" placeholder="http://127.0.0.1:8000"></label><label>Bearer token<input id="token" type="password" placeholder="Required for API mode"></label><div class="row"><label class="check"><input id="demo" type="checkbox"> Use local demo mode</label><button id="connect">Connect</button></div></section><section class="actions"><div class="section-head"><h2>Overview</h2><button class="ghost" id="refresh">Refresh</button></div><div id="status" class="status">Connect to load your backup status.</div><div id="devices" class="devices"></div></section><section class="maintenance"><h2>Maintenance</h2><div class="button-grid"><button id="register">Register this device</button><button id="health">Check API health</button><button id="docs">Open API docs</button></div></section><section class="health"><div class="section-head"><h2>System health <span class="hint">(read-only, this device)</span></h2><button class="ghost" id="healthRefresh">Refresh</button></div><div id="healthBody" class="health-body">Loading…</div></section><section class="updates"><div class="section-head"><h2>Software updates</h2><button class="ghost" id="updatesRefresh">Check</button></div><div id="updatesBody" class="updates-body">Not checked yet.</div><div class="row"><button id="restart" class="danger">Restart this computer…</button></div></section><section class="earnings"><div class="section-head"><h2>Storage earnings <span class="hint">(mock ledger)</span></h2><button class="ghost" id="earningsRefresh">Refresh</button></div><div id="earningsBody" class="earnings-body">—</div><button id="watchAd">Start ad break</button></section><p id="notice" class="notice" role="status"></p></main><script src="renderer.js"></script></body></html>
