<!doctype html><html><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ad break</title><link rel="stylesheet" href="screensaver.css"></head><body>
<main>
  <p class="tag">MOCK AD · funds your storage ledger, not a real ad network</p>
  <div id="slide" class="slide">
    <h1 id="slideTitle">Loading…</h1>
    <p id="slideBody"></p>
  </div>

      <div class="spacer"></div>
      <button id="close" disabled>Close</button>
    </div>

  </div>
</main>
<script src="screensaver.js"></script>
</body></html>
